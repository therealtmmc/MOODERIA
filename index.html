<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#46178f">
    <title>Mooderia</title>
    <link rel="manifest" href="manifest.json">
    <!-- Favicon & Touch Icon -->
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    <meta property="og:image" content="/logo.png">
    <meta property="og:title" content="Mooderia">
    <meta property="og:description" content="A vibrant social and wellness platform where moods shape the skyline.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        height: 100%;
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        background-color: #f2f2f2;
        width: 100%;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      * {
        font-family: 'Montserrat', sans-serif;
      }
      #root {
        height: 100%;
        overflow: hidden;
      }
      .kahoot-shadow { box-shadow: 0 6px 0 0 rgba(0,0,0,0.2); }
      .kahoot-button-purple { background-color: #46178f; border-bottom: 6px solid #321067; }
      .kahoot-button-blue { background-color: #1368ce; border-bottom: 6px solid #0e4c99; }
      .kahoot-button-green { background-color: #26890c; border-bottom: 6px solid #1c6409; }
      .kahoot-button-red { background-color: #e21b3c; border-bottom: 6px solid #b31530; }
      .kahoot-button-yellow { background-color: #ffa602; border-bottom: 6px solid #cc8502; }
      .kahoot-button-custom { background-color: var(--theme-color, #46178f); border-bottom: 8px solid rgba(0,0,0,0.3); }
      
      .kahoot-button:active, .kahoot-button-custom:active { 
        transform: translateY(4px); 
        border-bottom-width: 2px; 
      }
      
      .streak-glow { filter: drop-shadow(0 0 12px rgba(255, 166, 2, 0.4)); }
      .fading-scrollbar::-webkit-scrollbar { width: 6px; }
      .fading-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .fading-scrollbar::-webkit-scrollbar-thumb { background: transparent; border-radius: 10px; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
      .pt-safe { padding-top: env(safe-area-inset-top); }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "framer-motion": "https://esm.sh/framer-motion@^12.31.0",
    "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
    "firebase/database": "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js",
    "firebase/": "https://esm.sh/firebase@^12.9.0/",
    "@capacitor/cli": "https://esm.sh/@capacitor/cli@^8.0.2"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
